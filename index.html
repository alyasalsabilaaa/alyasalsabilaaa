<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Alya Salsabila</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <!-- Card Biodata -->
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body text-center p-4">

                        <!-- Foto -->
                        <div class="mb-3">
                            <img src="https://via.placeholder.com/150"
                                 alt="Foto Alya Salsabila"
                                 class="rounded-circle img-fluid"
                                 style="width: 150px; height: 150px; object-fit: cover;">
                        </div>

                        <h2 class="fw-bold text-primary">
                            Alya Salsabila
                        </h2>

                        <p class="text-muted mb-4">
                            Mahasiswa Semester 1
                        </p>

                        <!-- Data Biodata -->
                        <div class="text-start">
                            <div class="mb-3">
                                <strong>Nama Lengkap</strong>
                                <p class="mb-0">Alya Salsabila</p>
                            </div>

                            <div class="mb-3">
                                <strong>Kelas / Program Studi</strong>
                                <p class="mb-0">Komputerisasi Akuntansi</p>
                            </div>

                            <div class="mb-3">
                                <strong>Semester</strong>
                                <p class="mb-0">1</p>
                            </div>
                        </div>

                        <hr>

                        <p class="text-muted mb-0">
                            "Belajar, berkembang, dan menjadi lebih baik setiap hari."
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
